openapi: 3.1.0
info:
  title: Workbench Store API
  description: Spec for the internal API. It documents most routes, misses a few on purpose, and lists two that are not implemented.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use user-token or admin-token.
  schemas:
    Address:
      type: object
      required: [street, city, country]
      properties:
        street: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 2 }

paths:
  /api/categories:
    get:
      summary: List categories
      operationId: listCategories
      tags: [Catalog]
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }

  /api/products:
    get:
      summary: List products with filters and pagination
      operationId: listProducts
      tags: [Catalog]
      parameters:
        - { name: category_id, in: query, schema: { type: integer } }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, discontinued] }
        - { name: search, in: query, schema: { type: string, maxLength: 50 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: A page of products
    post:
      summary: Create a product
      operationId: createProduct
      tags: [Catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, name, price]
              properties:
                category_id: { type: integer, minimum: 1 }
                name: { type: string, minLength: 3, maxLength: 255 }
                description: { type: string, maxLength: 2000 }
                price: { type: number, minimum: 0, maximum: 100000 }
                status: { type: string, enum: [active, inactive, discontinued] }
                stock_quantity: { type: integer, minimum: 0 }
                sku: { type: string, maxLength: 100 }
                is_featured: { type: boolean }
                tags:
                  type: array
                  maxItems: 10
                  items: { type: string, maxLength: 30 }
                specifications: { type: object }
      responses:
        '201': { description: Product created }
        '401': { description: Missing or invalid token }
        '422': { description: Validation failed }

  /api/products/{product}:
    parameters:
      - { name: product, in: path, required: true, schema: { type: integer } }
    get:
      summary: Show a product
      operationId: showProduct
      tags: [Catalog]
      responses:
        '200': { description: The product }
        '404': { description: Not found }
    put:
      summary: Update a product
      operationId: updateProduct
      tags: [Catalog]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 3, maxLength: 255 }
                description: { type: string, maxLength: 2000 }
                price: { type: number, minimum: 0, maximum: 100000 }
                status: { type: string, enum: [active, inactive, discontinued] }
                stock_quantity: { type: integer, minimum: 0 }
                is_featured: { type: boolean }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete a product (admin only)
      operationId: deleteProduct
      tags: [Catalog]
      security:
        - bearerAuth: []
      responses:
        '204': { description: Deleted }
        '403': { description: Not an admin }

  /api/orders:
    get:
      summary: List the orders of the current user
      operationId: listOrders
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200': { description: Orders }
    post:
      summary: Place an order
      operationId: createOrder
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method, shipping_address, items]
              properties:
                payment_method: { type: string, enum: [credit_card, paypal, bank_transfer] }
                shipping_address:
                  $ref: '#/components/schemas/Address'
                notes: { type: string, maxLength: 500 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer, minimum: 1 }
                      quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '201': { description: Order placed }

  /api/orders/{order}/status:
    patch:
      summary: Change the status of an order
      operationId: updateOrderStatus
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, processing, shipped, delivered, cancelled] }
      responses:
        '200': { description: Updated }

  # Documented but not implemented. These have no controller.
  # The app also has routes missing from this file: health, me, orders/{order}, products/{product}/restock, reports/sales.
  /api/customers:
    get:
      summary: List customers
      operationId: listCustomers
      tags: [Planned]
      responses:
        '200': { description: Customers }
    post:
      summary: Create a customer
      operationId: createCustomer
      tags: [Planned]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                age: { type: integer, minimum: 18 }
      responses:
        '201': { description: Created }

  /api/customers/{customer}:
    parameters:
      - { name: customer, in: path, required: true, schema: { type: integer } }
    get:
      summary: Show a customer
      operationId: showCustomer
      tags: [Planned]
      responses:
        '200': { description: The customer }
    patch:
      summary: Update a customer
      operationId: updateCustomer
      tags: [Planned]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                newsletter: { type: boolean }
      responses:
        '200': { description: Updated }

  /api/invoices:
    post:
      summary: Create an invoice
      operationId: createInvoice
      tags: [Planned]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: integer }
                due_date: { type: string, format: date }
      responses:
        '201': { description: Created }
