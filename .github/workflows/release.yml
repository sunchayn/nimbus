name: release-please

on:
  push:
    branches:
      - base

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.CI_TOKEN }}
          target-branch: base
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Handle the PR artifacts while the PR is open/updated
      # The output 'pr' is only present if a release PR was created or updated.
      - name: Checkout PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          # Use headBranchName from the PR object
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.CI_TOKEN }}

      - name: Setup Node
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache node_modules
        if: ${{ steps.release.outputs.pr }}
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: ${{ steps.release.outputs.pr }}
        run: npm ci --ignore-scripts

      - name: Get version from package.json
        if: ${{ steps.release.outputs.pr }}
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate production artifacts
        if: ${{ steps.release.outputs.pr }}
        run: npm run build

      - name: Commit and push changes
        if: ${{ steps.release.outputs.pr }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update production artifacts for v${{ steps.package_version.outputs.version }}"
          file_pattern: "resources/dist/*"
          branch: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

  check-breaking:
    name: Check for breaking changes
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      is_breaking: ${{ steps.check-breaking.outputs.is_breaking }}
    steps:
      - name: Check for breaking changes
        id: check-breaking
        run: |
          BODY="${{ needs.release-please.outputs.body }}"
          if echo "$BODY" | grep -Ei "BREAKING[ -]CHANGE" > /dev/null; then
            echo "Breaking change detected in release notes. Skipping auto-deploy to demo."
            echo "is_breaking=true" >> $GITHUB_OUTPUT
          else
            echo "No breaking changes detected."
            echo "is_breaking=false" >> $GITHUB_OUTPUT
          fi

  deploy-demo:
    name: Deploy Demo
    needs: [release-please, check-breaking]
    if: ${{ needs.check-breaking.outputs.is_breaking == 'false' }}
    uses: ./.github/workflows/deploy-demo.yml
    secrets: inherit
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      triggered_by: release-please
