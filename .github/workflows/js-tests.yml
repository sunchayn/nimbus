name: run-js-tests

on:
  pull_request:
    paths:
      - '**.ts'
      - '**.js'
      - '.github/workflows/js-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    paths:
      - '**.ts'
      - '**.js'
      - '.github/workflows/js-tests.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
