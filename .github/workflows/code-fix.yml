name: fix-code-issues

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup Environment
    outputs:
      is_internal: ${{ steps.compute_is_internal.outputs.is_internal }}
      fixable: ${{ steps.filter.outputs.fixable }}
    steps:
      - name: Checkout code
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.CI_TOKEN || github.token }}

      - id: compute_is_internal
        run: echo "is_internal=${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            fixable:
              - '**.php'
              - '**.js'
              - '**.vue'
              - '**.ts'
              - 'package.json'
              - 'composer.json'

  style-fix-internal:
    needs: setup
    if: needs.setup.outputs.is_internal == 'true' && needs.setup.outputs.fixable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Apply Code Fixes (Internal)

    steps:
      - name: Checkout code
        if: ${{ !env.ACT }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.CI_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Fix js styles if Eslint passes
        run: npm run style:fix

      - name: Commit JS changes
        if: ${{ !env.ACT }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply TS style fixes"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Rector
        run: composer rector

      - name: Commit Rector changes
        if: ${{ !env.ACT }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "refactor: apply rector"

      - name: Fix php styles
        run: composer style:fix

      - name: Commit php changes
        if: ${{ !env.ACT }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply php style fixes"

      - name: Fail if fixes could not be auto-applied
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Code fixers produced changes, but it was not possible to auto-commit them."
            echo "Please apply the code fixes locally and push them to the PR branch."
            exit 1
          fi

  style-check-fork:
    needs: setup
    if: needs.setup.outputs.is_internal == 'false' && needs.setup.outputs.fixable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Check Code Styles (Fork)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Check js styles
        run: npm run style:check

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v3

      - name: Check Rector
        run: composer rector -- --dry-run

      - name: Check php styles
        run: vendor/bin/pint --test

  status:
    needs: [style-fix-internal, style-check-fork]
    if: always()
    runs-on: ubuntu-latest
    name: Code Fix Status
    steps:
      - name: Check overall status
        run: |
          if [[ "${{ needs.style-fix-internal.result }}" == "failure" || "${{ needs.style-check-fork.result }}" == "failure" ]]; then
            echo "One of the style jobs failed."
            exit 1
          fi
          echo "All required style jobs passed or were skipped."
          exit 0
