name: CI

on:
  push:
    branches: [ base ]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-code-issues:
    uses: ./.github/workflows/code-fix.yml
    secrets: inherit

  php-tests:
    needs: fix-code-issues
    if: always()
    uses: ./.github/workflows/php-tests.yml
    secrets: inherit

  js-tests:
    needs: fix-code-issues
    if: always()
    uses: ./.github/workflows/js-tests.yml
    secrets: inherit

  e2e-tests:
    needs: fix-code-issues
    if: always()
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  phpstan:
    needs: fix-code-issues
    if: always()
    uses: ./.github/workflows/phpstan.yml
    secrets: inherit

  types-check:
    needs: fix-code-issues
    if: always()
    uses: ./.github/workflows/types-check.yml
    secrets: inherit
